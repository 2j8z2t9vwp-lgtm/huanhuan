[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "douyin-mcp-server"
version = "1.0.0"
description = "MCP server for Douyin (TikTok China) video parsing and text extraction"
authors = [
  { name="Your Name", email="your@email.com" }
]
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "ffmpeg-python>=0.2.0",
  "mcp>=1.0.0",
  "python-dotenv>=1.0.0"
]
[project.scripts]
douyin-mcp-server = "douyin_mcp.main:main"
